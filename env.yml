name: lvmworkshop
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.12
  - pytorch
  - numpy>=1.26
  - scipy
  - pandas
  - scikit-learn
  - matplotlib
  - h5py
  - pytables
  - einops
  - yacs
  - ipykernel
  - ipython
  - jupyter
  - jupyterlab
  - pip
  - pip:
      - -e ./external/xfads
      - -e ./external/neurofisherSNR
      - rich
